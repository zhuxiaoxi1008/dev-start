<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 支持刘海屏安全区；interactive-widget 让移动端键盘弹出时压缩可视区而非遮挡输入框 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef2ff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1020" />
    <title>DevStart - 开发者起始页</title>
    <link rel="icon" href="/favicon.ico?v=1" type="image/x-icon">
  </head>
  <body class="bg-slate-950 text-slate-500">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
